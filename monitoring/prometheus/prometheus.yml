global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: llama-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - llama-server:8080

  - job_name: interface-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - interface-server:9100
