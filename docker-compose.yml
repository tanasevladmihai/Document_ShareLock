services:
  llama-server:
    build:
      context: ./ml_backend
    container_name: llama-server
    hostname: llama-server
    ports:
      - "8082:8080"
    volumes:
      - ${MODEL_CACHE_DIR:-/opt/document-sharelock/models}:/models:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - llm-net

  interface-server:
    build:
      context: ./interface
    container_name: interface-server
    ports:
      - "8501:8501"
      - "9100:9100"
    environment:
      PROMETHEUS_METRICS_PORT: "9100"
      GRAFANA_EMBED_URL: "http://localhost:3000/d/document-sharelock/document-sharelock-monitoring?orgId=1&kiosk"
      MODEL_CONNECT_RETRIES: "12"
      MODEL_RETRY_DELAY_SECONDS: "5"
    depends_on:
      llama-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - llm-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro,Z
    depends_on:
      llama-server:
        condition: service_healthy
      interface-server:
        condition: service_started
    networks:
      - llm-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - llm-net

networks:
  llm-net:
    driver: bridge
